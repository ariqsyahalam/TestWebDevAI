<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pendaftaran Kelas - Sanbercode</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .form-section {
        margin-top: 50px;
      }
      .btn-primary {
        background-color: #0b0c5b;
        border-radius: 25px;
        padding: 10px 30px;
      }
      .form-control {
        border-radius: 15px;
      }
      .form-label {
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container text-center mt-4">
        <a href="index.html">
          <img src="sanbercode-logo.png" alt="Sanbercode Logo" width="150" />
        </a>
      </div>
    </header>

    <div class="container form-section">
      <h2 class="text-center mb-4">Pendaftaran Kelas</h2>
      <form action="process_registration.php" method="POST">
        <div class="mb-3">
          <label for="pilihanKelas" class="form-label">Pilihan Kelas</label>
          <select
            class="form-select form-control"
            name="pilihanKelas"
            id="pilihanKelas"
            aria-label="Pilih Kelas"
          >
            <option selected value="Prompt Engineer">Prompt Engineer</option>
            <option value="React JS - Web Frontend Development">
              React JS - Web Frontend Development
            </option>
            <option value="UI/UX Design">UI/UX Design</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="nama" class="form-label">Nama</label>
          <input
            type="text"
            class="form-control"
            name="nama"
            id="nama"
            placeholder="Masukkan nama Anda"
            required
          />
        </div>

        <div class="mb-3">
          <label for="nomorWhatsapp" class="form-label">Nomor Whatsapp</label>
          <input
            type="text"
            class="form-control"
            name="nomorWhatsapp"
            id="nomorWhatsapp"
            placeholder="Masukkan nomor Whatsapp Anda"
            required
          />
        </div>

        <div class="text-end">
          <button type="submit" class="btn btn-primary">Kirim Data</button>
        </div>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
